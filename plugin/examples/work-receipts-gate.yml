# Copy to .github/workflows/work-receipts-gate.yml in the repository the agent works on.
# Commit the session's receipt with the code:  git add -f .receipts/sessions/<session>/receipt.json
# The receipt folder is excluded from the code identity, so committing it does not change what it proves.
name: Work Receipts gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check the pull request's own head commit, not GitHub's merge preview.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: iamGodofall/work-receipts@main # pin to a full commit SHA in production
        with:
          trusted-keys: "0000:0000:0000:0000:0000:0000:0000:0000" # replace with your published fingerprint(s)
