name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, plugin build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Confirm the committed plugin bundle is current
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run build:plugin
          git diff --exit-code -- plugin/dist || { echo "plugin/dist is stale"; exit 1; }
