name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, plugin build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use current npm resolver
        run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Capture dependency audit report
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const report = require('./npm-audit.json');
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          if (!report.metadata || !report.vulnerabilities) {
            throw new Error('npm audit did not return a valid report');
          }
          for (const [name, item] of Object.entries(report.vulnerabilities)) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : entry.title)
            }));
          }
          if (Number(counts.total ?? 0) > 0) {
            console.error(`npm audit found ${counts.total} known vulnerability finding(s). Resolve them or document an explicit, time-bounded exception before release.`);
            process.exitCode = 1;
          }
          NODE
      - name: Upload dependency audit report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: work-receipts-npm-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: warn
      - run: npm run typecheck
      - run: npm test
      - name: Build plugin bundle
        id: build_plugin
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:plugin
      - name: Upload built plugin bundle
        if: always() && matrix.os == 'ubuntu-latest' && steps.build_plugin.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: work-receipts-plugin-dist-${{ github.sha }}
          path: plugin/dist/**
          if-no-files-found: error
      - name: Run adversarial benchmark
        if: matrix.os == 'ubuntu-latest'
        run: npm run bench
      - name: Upload benchmark report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: work-receipts-benchmark-${{ github.sha }}
          path: docs/BENCHMARK-RESULTS.md
          if-no-files-found: warn
      - name: Confirm the committed plugin bundle is current
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git diff --exit-code -- plugin/dist || { echo "plugin/dist is stale"; exit 1; }
