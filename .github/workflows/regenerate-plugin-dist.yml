name: Regenerate plugin bundles

on:
  push:
    branches:
      - "security/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: regenerate-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'iamGodofall/work-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile from package manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:plugin
      - run: npm run bench
      - name: Commit generated bundles when changed
        id: commit_bundles
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json plugin/dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json plugin/dist
          git commit -m "build: regenerate plugin bundles from source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch full CI for the generated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
